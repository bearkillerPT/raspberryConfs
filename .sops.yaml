keys:
  # Gil's key (~/.config/sops/age/keys.txt): can edit every secret. Keep a copy of it somewhere safe.
  - &gil age1g5r8pjwvyj6er3r2hyzd6tutlrx0yauryfxjh3kh5nat5k7m7upquxguah
  # The Pi, derived from its SSH host key (keys/pi_ssh_host_ed25519_key.pub)
  - &pi age1vg5jcram30z78v7ulgqha6g8zjxl7yna2kulptkl7v67c73ywp9sc6z0v9
  # Throwaway key for the VM test (tests/age-key.txt). Its secrets are dummies.
  - &test age1y0vzdvwepytj66ksppm9rj4ghk0zkf96tkjc2rr92g6rs24hqsms76cryy
creation_rules:
  - path_regex: secrets/pi\.yaml$
    key_groups:
      - age: [*gil, *pi]
  # The Pi's SSH host private key, put in place when (re)installing the SD card
  - path_regex: secrets/pi_ssh_host_ed25519_key$
    key_groups:
      - age: [*gil]
  - path_regex: tests/secrets\.yaml$
    key_groups:
      - age: [*test]
